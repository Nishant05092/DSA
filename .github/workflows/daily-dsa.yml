name: Daily DSA Problem

on:
  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-dsa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily DSA problem
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Scripts:"
          ls -la scripts

          python scripts/daily_dsa.py

      - name: Configure Git
        run: |
          git config user.name "Nishant05092"
          git config user.email "155230428+Nishant05092@users.noreply.github.com"
      
      - name: Commit changes
        run: |
          git add .
          git commit -m "Add daily DSA problem" || echo "No changes to commit"
          git push
